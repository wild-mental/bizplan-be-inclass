plugins {
	id 'java'
	id 'org.springframework.boot' version '4.0.0'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'vibe.makersround'
version = '0.0.1-SNAPSHOT'
description = 'MakersRound Backend API - AI Co-Pilot for First-time Founders'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	// Spring AI (Google Gemini)
	implementation platform('org.springframework.ai:spring-ai-bom:2.0.0-M1')
	implementation 'org.springframework.ai:spring-ai-starter-model-google-genai'

	// Web
	implementation 'org.springframework.boot:spring-boot-starter-web'
	
	// Mail
	implementation 'org.springframework.boot:spring-boot-starter-mail'
	
	// JPA & Database
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	runtimeOnly 'org.xerial:sqlite-jdbc'  // SQLite database
	implementation 'org.hibernate.orm:hibernate-community-dialects'  // SQLite Dialect support
	
	// ULID 생성기 (시간 정렬 가능한 Request ID 용도)
	implementation 'com.github.f4b6a3:ulid-creator:5.2.2'
	
	// Validation
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	
	// Security & JWT
	implementation 'org.springframework.boot:spring-boot-starter-security'
	// Spring Security 명시적 의존성 추가 (Spring Boot 4.0.0 호환성)
	implementation 'org.springframework.security:spring-security-core'
	implementation 'org.springframework.security:spring-security-web'
	implementation 'org.springframework.security:spring-security-config'
	implementation 'io.jsonwebtoken:jjwt-api:0.12.5'
	runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.5'
	runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.5'
	
	// Lombok
	compileOnly 'org.projectlombok:lombok'
	annotationProcessor 'org.projectlombok:lombok'
	
	// Flyway for DB Migration - 최신 안정 버전 명시
	implementation 'org.flywaydb:flyway-core:11.17.0'
	// SQLite support - Flyway 11+ includes SQLite support in flyway-core
	// If SQLite support is not working, try adding: implementation 'org.flywaydb:flyway-database-sqlite'
	
	// Core
	implementation 'org.springframework.boot:spring-boot-starter'
	
	// DevTools
	developmentOnly 'org.springframework.boot:spring-boot-devtools'
	
	// OpenAPI / Swagger UI (SpringDoc)
	implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.7.0'
	
	// Dotenv for .env file support
	implementation 'io.github.cdimascio:dotenv-java:3.0.0'
	
	// Document Generation Libraries
	implementation 'org.apache.pdfbox:pdfbox:3.0.3'
	implementation 'org.apache.poi:poi-ooxml:5.3.0'
	
	// Caching (Caffeine)
	implementation 'org.springframework.boot:spring-boot-starter-cache'
	implementation 'com.github.ben-manes.caffeine:caffeine:3.1.8'
	
	// Test
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	
	// Test - SQLite for integration tests
	testRuntimeOnly 'org.xerial:sqlite-jdbc'
}

// Plain jar 생성 비활성화 (Spring Boot executable jar만 생성)
tasks.named('jar') {
	enabled = false
}

tasks.named('test') {
	useJUnitPlatform()
	
	if (project.hasProperty('integration') || 
		project.gradle.startParameter.taskNames.any { it.contains('IntegrationTest') }) {
		systemProperty 'runIntegrationTests', 'true'
	}
}

tasks.register('testABTest', Test) {
	description = 'Run A/B Test related tests only'
	group = 'verification'
	
	useJUnitPlatform()
	
	filter {
		// Match all test classes in ab packages (repository, service, controller)
		includeTestsMatching 'vibe.makersround.makersround_backend.repository.ab.*'
		includeTestsMatching 'vibe.makersround.makersround_backend.service.ab.*'
		includeTestsMatching 'vibe.makersround.makersround_backend.controller.ab.*'
	}
	
	testLogging {
		events 'passed', 'skipped', 'failed'
		showStandardStreams = true
	}
}
