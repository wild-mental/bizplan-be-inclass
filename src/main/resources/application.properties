spring.application.name=bizplan-be-inclass

# ============================================
# Active Profile Configuration
# ============================================
# Set via environment variable: SPRING_PROFILES_ACTIVE=local|dev|prod
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}

# ============================================
# SQLite Database Configuration
# ============================================
spring.datasource.url=jdbc:sqlite:./data/bizplan.db
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.datasource.username=
spring.datasource.password=

# ============================================
# JPA / Hibernate Configuration (SQLite)
# ============================================
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.properties.hibernate.dialect=org.hibernate.community.dialect.SQLiteDialect
# Flyway가 스키마를 관리하므로 Hibernate는 스키마 생성을 하지 않음
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ============================================
# Flyway Migration Configuration (SQLite)
# ============================================
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration/sqlite
spring.flyway.baseline-version=0
# SQLite 데이터베이스 설정 명시
spring.flyway.url=${spring.datasource.url}
spring.flyway.driver-class-name=${spring.datasource.driver-class-name}
# Flyway 로깅 활성화 (디버깅용)
logging.level.org.flywaydb=DEBUG

# ============================================
# Connection Pool Configuration (SQLite)
# ============================================
# SQLite는 읽기 작업은 동시에 여러 커넥션에서 가능하며,
# 쓰기 작업은 SQLite가 내부적으로 락을 관리하므로
# 풀 크기를 충분히 확보하여 읽기 성능을 최적화합니다.

# 최대 커넥션 수: 동시 읽기 요청 처리용
spring.datasource.hikari.maximum-pool-size=20

# 최소 유휴 커넥션: 빠른 응답을 위한 준비 상태 커넥션
spring.datasource.hikari.minimum-idle=5

# 커넥션 획득 대기 시간 (ms) - 30초
spring.datasource.hikari.connection-timeout=30000

# 유휴 커넥션 타임아웃 (ms) - 10분
spring.datasource.hikari.idle-timeout=600000

# 커넥션 최대 수명 (ms) - 30분
spring.datasource.hikari.max-lifetime=1800000

# 커넥션 누수 감지 임계값 (ms) - 60초 이상 사용 시 경고
spring.datasource.hikari.leak-detection-threshold=60000

# ============================================
# Server Configuration
# ============================================
server.port=${SERVER_PORT:8080}

# ============================================
# Spring AI - Google Gemini Configuration
# ============================================
# GEMINI_API_KEY는 .env 등 환경변수에서 주입하는 것을 권장
spring.ai.google.genai.api-key=${GEMINI_API_KEY:WARN_GEMINI_API_KEY_MISSING_IN_PRODUCTION}
spring.ai.google.genai.chat.options.model=gemini-2.5-flash-lite
spring.ai.google.genai.chat.options.temperature=0.8
spring.ai.google.genai.chat.options.top-p=0.9

# ============================================
# Security Configuration
# ============================================
app.security.jwt-secret=${JWT_SECRET:WARN_JWT_SECRET_MISSING_IN_PRODUCTION}
app.security.encryption-key=${ENCRYPTION_KEY:WARN_ENCRYPTION_KEY_MISSING_IN_PRODUCTION}

# ============================================
# Mail Configuration (Resend SMTP)
# ============================================
spring.mail.host=${MAIL_HOST:smtp.resend.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:resend}
spring.mail.password=${MAIL_PASSWORD:WARN_RESEND_API_KEY_MISSING_IN_PRODUCTION}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# ============================================
# Application Configuration
# ============================================
mail.from-address=noreply@send.makersround.world
app.mail.from=${MAIL_FROM:noreply@send.makersround.world}
app.frontend.url=${FRONTEND_URL:http://localhost:5173}

# ============================================
# CORS Configuration
# ============================================
# 허용할 Origin 목록 (쉼표로 구분)
# 개발 환경: localhost
# 실서비스: makersround.world, www.makersround.world
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,https://makersround.world,http://makersround.world,https://www.makersround.world,http://www.makersround.world}

# ============================================
# Admin Configuration
# ============================================
# 어드민 권한을 가진 이메일 목록 (쉼표로 구분)
app.admin.emails=${ADMIN_EMAILS:admin@makersround.world}

# ============================================
# API Logging Configuration
# ============================================
# API 요청/응답 로깅 활성화 여부
app.logging.api.enabled=${API_LOGGING_ENABLED:true}
# 파일에 로깅 여부
app.logging.api.log-to-file=${API_LOGGING_TO_FILE:true}
# 콘솔에 로깅 여부
app.logging.api.log-to-console=${API_LOGGING_TO_CONSOLE:true}
# 로그에 기록할 최대 본문 크기 (bytes)
app.logging.api.max-body-size=${API_LOGGING_MAX_BODY_SIZE:10000}

# ============================================
# Logging Path Configuration
# ============================================
# 로그 파일 저장 경로 (프로젝트 루트 기준, 상대 경로)
# 기본값: ./logs (프로젝트 루트의 logs 폴더)
logging.file.path=${LOG_PATH:./logs}
