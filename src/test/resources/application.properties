# Test Configuration
spring.application.name=makersround-backend-test

# SQLite In-Memory Database for Tests
spring.datasource.url=jdbc:sqlite::memory:
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.datasource.username=
spring.datasource.password=

# JPA Configuration for Tests
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.properties.hibernate.dialect=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.defer-datasource-initialization=true

# Flyway enabled for Tests (SQLite migration)
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration/sqlite
# Flyway + JPA 초기화 시 커넥션 부족 타임아웃을 방지하기 위해 최소 2개 이상 확보
spring.datasource.hikari.maximum-pool-size=5

# Mail (테스트용 더미 설정으로 JavaMailSender 빈 생성)
spring.mail.host=localhost
spring.mail.port=2525
spring.mail.username=
spring.mail.password=
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false

# Disable data.sql loading for tests
spring.sql.init.mode=never

# Spring AI - Google Gemini Configuration (for integration tests)
# GEMINI_API_KEY 환경변수가 설정되어 있어야 통합 테스트가 실행됩니다.
spring.ai.google.genai.api-key=${GEMINI_API_KEY:}
spring.ai.google.genai.chat.options.model=gemini-2.5-flash-lite
spring.ai.google.genai.chat.options.temperature=0.8
spring.ai.google.genai.chat.options.top-p=0.9

